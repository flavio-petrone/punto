name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, fileinfo, gd, zip
          coverage: none
      - run: python3 tests/integration.py
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable_ci_password
          MYSQL_DATABASE: punto_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable_ci_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, mbstring, fileinfo, gd, zip
          coverage: none
      - run: python3 tests/integration.py
        env:
          PUNTO_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=punto_test;charset=utf8mb4
          PUNTO_TEST_MYSQL_USER: root
          PUNTO_TEST_MYSQL_PASSWORD: disposable_ci_password
